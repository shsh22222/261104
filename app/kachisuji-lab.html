<title>勝ち筋ラボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 作業台。上に固定の見出しとタブ、本文は1列（最大1120px）。カードは入力パネルと記録だけに使い、指標は罫線と余白で区切る。
   色は11/1資料の「橙＋スレート」を引き継ぐ。橙は「次にやること・目標」だけに使う。 */
:root {
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --sunk: #EEF1F4;
  --ink: #1D2430;
  --ink-2: #485263;
  --muted: #6F7A8A;
  --line: #DDE2E8;
  --slate: #2A3341;
  --on-slate: #F3F5F8;
  --accent: #E0560B;
  --accent-ink: #A9400A;
  --accent-soft: #FCEADC;
  --good: #2D7A4D;
  --good-soft: #E1F1E7;
  --warn: #946200;
  --warn-soft: #FBF0D6;
  --bad: #B3362B;
  --bad-soft: #F9E1DE;
  --bar: #E0560B;
  --bar-track: #ECEFF3;
  --shadow: 0 1px 2px rgba(29,36,48,.06), 0 4px 16px rgba(29,36,48,.06);
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161C; --surface: #1A2029; --sunk: #222935; --ink: #E8EBEF; --ink-2: #BAC2CD; --muted: #8E98A7;
    --line: #2E3643; --slate: #0D1117; --on-slate: #E8EBEF;
    --accent: #F2782F; --accent-ink: #F59A5E; --accent-soft: #3A2618;
    --good: #5DBB84; --good-soft: #17301F; --warn: #E0B04A; --warn-soft: #33290F; --bad: #EE7A6E; --bad-soft: #3A1C19;
    --bar: #F2782F; --bar-track: #262E3A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161C; --surface: #1A2029; --sunk: #222935; --ink: #E8EBEF; --ink-2: #BAC2CD; --muted: #8E98A7;
  --line: #2E3643; --slate: #0D1117; --on-slate: #E8EBEF;
  --accent: #F2782F; --accent-ink: #F59A5E; --accent-soft: #3A2618;
  --good: #5DBB84; --good-soft: #17301F; --warn: #E0B04A; --warn-soft: #33290F; --bad: #EE7A6E; --bad-soft: #3A1C19;
  --bar: #F2782F; --bar-track: #262E3A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--slate); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.35; text-wrap: balance; margin: 0; }
h1 { font-size: 1.55rem; }
h2 { font-size: 1.12rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--slate); color: var(--on-slate); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 4px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand b { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: .04em; }
.brand b i { font-style: normal; color: var(--accent); }
.brand span { font-size: .8rem; color: color-mix(in srgb, var(--on-slate) 70%, transparent); }
@media (max-width: 600px) { .brand span { display: none; } .top-in { padding-block: 10px 2px; } }
.mode { font-size: .75rem; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--on-slate) 25%, transparent); white-space: nowrap; }
.mode::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.mode.is-db::before { background: #5DBB84; }
.mode.is-local::before { background: #E0B04A; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 0; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { color: color-mix(in srgb, var(--on-slate) 72%, transparent); text-decoration: none; padding: 8px 12px 10px; font-size: .9rem; white-space: nowrap; border-bottom: 3px solid transparent; }
.tabs a:hover { color: var(--on-slate); }
.tabs a[aria-current="page"] { color: var(--on-slate); border-bottom-color: var(--accent); font-weight: 700; }

main.wrap { padding-block: 24px 64px; display: grid; gap: 28px; }
main > * { min-width: 0; }

/* generic */
.lead { color: var(--ink-2); max-width: 68ch; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.grid2 { display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
.grid2 > * { min-width: 0; }
.block { display: grid; gap: 14px; align-content: start; }
.block > *, .stack > * { min-width: 0; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.src { font-size: .75rem; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.empty b { color: var(--ink); }
.lbl { display: inline-block; font-size: .72rem; letter-spacing: .06em; color: var(--muted); margin-right: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .9rem; line-height: 1.4; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.sm { padding: 4px 10px; font-size: .8rem; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: .88rem; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; line-height: 1.5; padding: 1px 8px; border-radius: 99px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip.solid { background: var(--slate); color: var(--on-slate); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--sunk); padding: 3px; border-radius: 8px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: .85rem; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* forms */
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: .8rem; color: var(--ink-2); font-weight: 700; }
.field > span em { font-style: normal; color: var(--accent-ink); font-weight: 400; margin-left: 4px; }
.field small { color: var(--muted); font-size: .76rem; }
input[type=text], input[type=search], input[type=date], input[type=number], select, textarea {
  width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); line-height: 1.5;
}
textarea { resize: vertical; min-height: 80px; }
.fgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.check { display: inline-flex; align-items: flex-start; gap: 8px; font-size: .86rem; cursor: pointer; }
.check input { margin-top: 5px; accent-color: var(--accent); }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 12px; }
legend { font-family: var(--font-display); font-weight: 700; margin-bottom: 8px; padding: 0; }

/* home */
.dates { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.date { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.date .dn { font-family: var(--font-num); font-size: 1.6rem; line-height: 1.2; }
.date .dn small { font-family: var(--font-body); font-size: .8rem; color: var(--muted); margin-left: 4px; }
.date .dl { font-size: .82rem; color: var(--ink-2); }
.date.is-near .dn { color: var(--accent-ink); }
.thesis { display: grid; gap: 6px; }
.thesis p { color: var(--ink-2); max-width: 70ch; }

.base { display: flex; align-items: stretch; flex-wrap: wrap; gap: 0; }
.bstep { padding: 6px 18px 6px 0; min-width: 96px; }
.bnum { font-family: var(--font-num); font-size: 1.9rem; line-height: 1.15; }
.blabel { font-size: .8rem; color: var(--ink-2); }
.barrow { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 16px 0 0; color: var(--muted); font-size: .78rem; }
.barrow b { font-family: var(--font-num); font-weight: 500; color: var(--ink-2); font-size: .9rem; }
.barrow::after { content: "→"; font-size: 1.1rem; line-height: 1; }
.bstep.is-zero .bnum { color: var(--bad); }
.callout { border-left: 0; background: var(--accent-soft); color: var(--ink); border-radius: var(--r); padding: 10px 14px; font-size: .88rem; }

.funnel { display: grid; gap: 2px; }
.frow { display: grid; grid-template-columns: minmax(7.5em, 10em) 1fr 3.2em; gap: 10px; align-items: center; padding: 4px 0; }
.frow .fl { font-size: .86rem; color: var(--ink-2); }
.track { height: 14px; background: var(--bar-track); border-radius: 0 4px 4px 0; position: relative; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.fill.zero { min-width: 0; }
.frow .fc { text-align: right; font-family: var(--font-num); }
.conv { display: grid; grid-template-columns: minmax(7.5em, 10em) 1fr; gap: 10px; font-size: .78rem; color: var(--muted); padding-left: 0; }
.conv > span:last-child { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.conv .rate { font-family: var(--font-num); color: var(--ink-2); }
.venue { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .86rem; padding: 10px 12px; background: var(--sunk); border-radius: var(--r); }

.hbars { display: grid; gap: 6px; }
.hb { display: grid; grid-template-columns: minmax(8em, 13em) 1fr 4.6em; gap: 10px; align-items: center; font-size: .86rem; }
.hb .hbl { color: var(--ink-2); overflow-wrap: anywhere; }
.hb .hbv { text-align: right; font-family: var(--font-num); font-size: .8rem; color: var(--ink-2); }
.hb.is-few .fill { opacity: .45; }

.nexts { display: grid; gap: 0; }
.nx { display: grid; grid-template-columns: 6.2em 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.nx:hover .nx-co { color: var(--accent-ink); }
.nx-co { font-weight: 700; }
.nx-tx { color: var(--ink-2); font-size: .86rem; overflow-wrap: anywhere; }

/* stage meter */
.meter { display: inline-grid; grid-template-columns: repeat(6, 10px); gap: 2px; vertical-align: middle; }
.meter i { height: 8px; background: var(--bar-track); border-radius: 1px; }
.meter i.on { background: var(--accent); }
.meter.stopped i.on { background: var(--muted); }
.meter.won i.on { background: var(--good); }

/* records */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input[type=search] { width: auto; flex: 1 1 200px; }
.progress { display: grid; gap: 6px; }
.progress .track { height: 10px; border-radius: 5px; }
.progress .fill { border-radius: 5px; }
.rlist { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.rhead, .ritem { display: grid; grid-template-columns: minmax(10em, 1.4fr) minmax(8em, 1fr) minmax(9.5em, 1fr) minmax(10em, 1.5fr) 5.5em; gap: 12px; padding: 10px 14px; align-items: center; }
.rhead { background: var(--sunk); font-size: .74rem; color: var(--muted); letter-spacing: .04em; }
.ritem { border-top: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.ritem:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.ritem > * { min-width: 0; overflow-wrap: anywhere; }
.r-co { font-weight: 700; }
.r-sub { font-size: .78rem; color: var(--muted); }
.r-next { font-size: .84rem; color: var(--ink-2); }
.r-date { font-size: .78rem; color: var(--muted); font-family: var(--font-num); }
@media (max-width: 760px) {
  .rhead { display: none; }
  .ritem { grid-template-columns: 1fr auto; gap: 4px 12px; }
  .ritem .r-date { grid-column: 2; grid-row: 1; }
  .ritem .r-c3, .ritem .r-c4 { grid-column: 1 / -1; }
}

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 50; }
.sheet-back { position: absolute; inset: 0; background: rgba(13,17,23,.45); }
.sheet-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(680px, 100%); background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: grid; gap: 18px; align-content: start; box-shadow: -8px 0 32px rgba(0,0,0,.18); }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.sheet-foot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
.guide { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; font-size: .86rem; }
.guide ol { margin: 6px 0 0; padding-left: 1.4em; display: grid; gap: 2px; }
details > summary { cursor: pointer; font-weight: 700; font-size: .9rem; }

/* AI output */
.ai-note { font-size: .8rem; color: var(--muted); }
.ai-out { display: grid; gap: 14px; }
.ai-status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hyps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hyp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; }
.hyp-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.hyp-q { font-size: .92rem; }
.hyp-ev { font-size: .82rem; color: var(--ink-2); }
.kv { display: grid; gap: 4px; }
.kv > div { font-size: .9rem; }
.thinking { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: .88rem; }
.thinking::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .thinking::before { animation: none; } }
.out-text { white-space: pre-wrap; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-height: 120px; }
textarea.out-text { min-height: 360px; font-family: var(--font-body); }

/* brief split */
.split { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); align-items: start; }
.split > * { min-width: 0; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; text-align: left; cursor: pointer; width: 100%; }
.card:hover { border-color: var(--muted); }
.card b { font-size: .95rem; }

/* story matrix */
.mx-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.mx { border-collapse: collapse; min-width: 980px; width: 100%; }
.mx th, .mx td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 10px; vertical-align: top; text-align: left; }
.mx th:last-child, .mx td:last-child { border-right: 0; }
.mx tr:last-child td, .mx tr:last-child th { border-bottom: 0; }
.mx thead th { background: var(--sunk); font-size: .78rem; color: var(--ink-2); font-weight: 700; }
.mx thead th small { display: block; font-weight: 400; color: var(--muted); }
.mx tbody th { width: 250px; font-weight: 400; }
.mx-series { display: grid; gap: 6px; }
.mx-series b { font-family: var(--font-display); }
.mx-core { font-size: .8rem; color: var(--ink-2); }
.cell { display: grid; gap: 6px; align-content: start; text-align: left; width: 100%; min-height: 84px; background: none; border: 1px dashed transparent; border-radius: 6px; padding: 6px; cursor: pointer; }
.cell:hover { border-color: var(--line); background: var(--sunk); }
.cell span.snip { font-size: .8rem; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* practice */
.personas { display: grid; gap: 8px; }
.persona { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; }
.persona:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.persona input { margin-top: 5px; accent-color: var(--accent); }
.persona b { display: block; }
.persona span { font-size: .8rem; color: var(--ink-2); }
.chat { display: grid; grid-template-rows: auto 1fr auto; gap: 10px; min-height: 480px; }
.msgs { display: grid; gap: 10px; align-content: start; overflow-y: auto; max-height: 60vh; padding: 4px; }
.msg { max-width: 88%; padding: 8px 12px; border-radius: 10px; font-size: .9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.hr { background: var(--surface); border: 1px solid var(--line); justify-self: start; }
.msg.me { background: var(--accent-soft); justify-self: end; }
.msg .who { display: block; font-size: .7rem; color: var(--muted); }
.compose { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.compose textarea { min-height: 60px; }
.scores { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.score { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.score .sn { font-family: var(--font-num); font-size: 1.5rem; }
.score .sn small { font-size: .8rem; color: var(--muted); }
.dots { display: inline-grid; grid-template-columns: repeat(4, 8px); gap: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--bar-track); }
.dots i.on { background: var(--accent); }
.plog { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
.plog table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: .85rem; }

/* ================= ユーティリティ ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
const pad = (n) => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const daysUntil = (ds) => { if (!ds) return null; const t = Date.parse(ds + "T00:00:00"); if (isNaN(t)) return null; const n = Date.parse(todayStr() + "T00:00:00"); return Math.round((t - n) / 86400000); };
const md = (ds) => { if (!ds) return ""; const [, m, d] = ds.split("-"); return Number(m) + "/" + Number(d); };
const fmtDate = (iso) => { if (!iso) return ""; const d = new Date(iso); if (isNaN(d)) return ""; return (d.getMonth() + 1) + "/" + d.getDate(); };
const newId = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const arr = (x) => (Array.isArray(x) ? x.filter((v) => v !== null && v !== undefined).map((v) => (typeof v === "object" ? v : String(v))) : x ? [String(x)] : []);
const str = (x) => (x === null || x === undefined ? "" : typeof x === "string" ? x : String(x));

/* ================= データ（共有DB／この端末） ================= */
const S = { loaded: {}, slow: false, err: null };
COLS.forEach((c) => { S[c] = []; });

const Store = {
  mode: "loading", db: null, user: null, uid: null, canWrite: null,
  async init() {
    let db = null, user = null;
    if (window.claude && typeof window.claude.use === "function") {
      try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { /* 使えない環境 */ }
    }
    this.user = user;
    if (user) {
      try { this.uid = await user.id(); } catch (e) { this.uid = null; }
      try { this.canWrite = await user.can("data.write"); } catch (e) { this.canWrite = null; }
    }
    if (db) { this.mode = "db"; this.db = db; COLS.forEach((c) => this.sub(c)); }
    else {
      this.mode = "local";
      COLS.forEach((c) => { S[c] = localLoad(c); S.loaded[c] = true; });
      onData();
    }
    renderMode();
  },
  sub(c) {
    const timer = setTimeout(() => { if (!S.loaded[c]) { S.slow = true; renderMode(); } }, 10000);
    this.db.collection(c).onSnapshot((snap) => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); if (S.slow) { S.slow = false; renderMode(); } }
      S[c] = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      S.loaded[c] = true; onData(c);
    }, (err) => { clearTimeout(timer); S.err = err && err.code; S.loaded[c] = true; renderMode(); onData(c); });
  },
  async put(c, id, data) {
    const now = new Date().toISOString();
    const prev = S[c].find((x) => x.id === id);
    const body = Object.assign({}, data, { updatedAt: now, updatedBy: this.uid || null });
    delete body.id;
    if (!prev) { body.createdAt = body.createdAt || now; body.by = body.by || this.uid || null; }
    else { body.createdAt = prev.createdAt || now; body.by = prev.by || null; }
    if (this.mode === "db") {
      try { await this.db.collection(c).doc(id).set(body); }
      catch (e) { throw new Error(dbErr(e)); }
    } else {
      S[c] = S[c].filter((x) => x.id !== id).concat([Object.assign({ id }, body)]);
      localSave(c); onData(c);
    }
    return id;
  },
  async del(c, id) {
    if (this.mode === "db") {
      try { await this.db.collection(c).doc(id).delete(); } catch (e) { throw new Error(dbErr(e)); }
    } else { S[c] = S[c].filter((x) => x.id !== id); localSave(c); onData(c); }
  }
};
function dbErr(e) {
  const code = e && e.code;
  if (code === "invalid_argument") return "保存できませんでした。このアプリへの書き込み権限がないか、内容が大きすぎます。";
  if (code === "quota_exceeded") return "保存できる件数・容量の上限に達しました。古い記録を整理してください。";
  if (code === "resource_exhausted") return "操作が続いたため一時的に保存できませんでした。少し待ってからもう一度。";
  if (code === "revoked") return "このアプリへのアクセスが変わったため保存できません。";
  return "保存できませんでした。通信状態を確かめて、もう一度試してください。";
}
function localLoad(c) { try { const v = localStorage.getItem("kachisuji:" + c); return v ? JSON.parse(v) : []; } catch (e) { return []; } }
function localSave(c) { try { localStorage.setItem("kachisuji:" + c, JSON.stringify(S[c])); } catch (e) { toast("この端末に保存できませんでした"); } }

function renderMode() {
  const m = $("#mode");
  m.classList.remove("is-db", "is-local");
  if (Store.mode === "db") {
    m.classList.add("is-db");
    m.textContent = S.err ? "共有データに接続できません" : S.slow ? "共有データの応答待ち" : Store.canWrite === false ? "閲覧のみ（共有）" : "チームで共有中";
  } else if (Store.mode === "local") { m.classList.add("is-local"); m.textContent = "この端末だけに保存"; }
  else m.textContent = "読み込み中";
}

/* ================= AI（Claude） ================= */
const AI = { fn: null, state: "loading" };
async function initAI() {
  if (!(window.claude && typeof window.claude.use === "function")) { AI.state = "off"; paintAI(); return; }
  try { AI.fn = await window.claude.use("sample"); } catch (e) { AI.fn = null; }
  AI.state = AI.fn ? "on" : "off"; paintAI();
}
function paintAI() {
  $$("[data-ai]").forEach((b) => { b.disabled = AI.state !== "on" || b.dataset.busy === "1"; });
  $$("[data-ai-note]").forEach((n) => {
    n.hidden = AI.state === "on";
    n.textContent = AI.state === "loading" ? "AIの準備中…" : "AIは、このアプリをClaudeの中で開いたときに使えます。ここでは「プロンプトをコピー」してClaudeに貼れば、同じ下書きがつくれます。";
  });
}
function aiErr(e) {
  const code = e && e.code;
  if (code === "cancelled") return null;
  if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) { AI.state = "off"; paintAI(); return "AIの利用が許可されていません。「プロンプトをコピー」をお使いください。"; }
  if (code === "rate_limited") return "AIが混み合っています。少し待ってから、もう一度押してください。";
  if (code === "refused") return "この入力ではAIが答えられませんでした。内容を見直してください。";
  if (code === "invalid_json") return "AIの答えの形が崩れました。もう一度押してください。";
  if (code === "prompt_too_large") return "入力が長すぎます。貼り付けた情報を短くしてください。";
  if (code === "session_expired") return "Claudeへのログインが切れています。ログインし直してください。";
  return "AIとの接続が途中で切れました。もう一度押してください。";

/* ================= 集計 ================= */
function stats(deals) {
  const reached = [0, 0, 0, 0, 0, 0, 0];
  deals.forEach((d) => { const s = Number(d.stage) || 1; for (let i = 1; i <= s && i <= 6; i++) reached[i]++; });
  const venue = deals.filter((d) => d.venue);
  const venueConsult = venue.filter((d) => (Number(d.stage) || 1) >= 3).length;
  const stopped = deals.filter((d) => d.status === "stopped");
  const reasons = {};
  stopped.forEach((d) => { const r = d.reason || "不明"; reasons[r] = (reasons[r] || 0) + 1; });
  return { n: deals.length, reached, venueN: venue.length, venueConsult, stopped: stopped.length, reasons, won: deals.filter((d) => d.status === "won" || Number(d.stage) === 6).length };
}
function compare(deals, key) {
  const base = deals.filter((d) => (Number(d.stage) || 1) >= 3);
  const groups = new Map();
  base.forEach((d) => {
    let g = key === "venue" ? (d.venue ? "信頼の場を経由" : "経由していない") : (d[key] || "未記入");
    if (!groups.has(g)) groups.set(g, { n: 0, k: 0 });
    const o = groups.get(g); o.n++; if ((Number(d.stage) || 1) >= 4) o.k++;
  });
  return Array.from(groups.entries()).map(([g, o]) => ({ g, n: o.n, k: o.k, r: pct(o.k, o.n) })).sort((a, b) => b.n - a.n);
}
function stageMeter(d) {
  const s = Number(d.stage) || 1; const cls = d.status === "stopped" ? "stopped" : (d.status === "won" || s === 6) ? "won" : "";
  let h = `<span class="meter ${cls}" aria-hidden="true">`; for (let i = 1; i <= 6; i++) h += `<i class="${i <= s ? "on" : ""}"></i>`; return h + "</span>";
}
function statusChip(d) {
  if (d.status === "won" || Number(d.stage) === 6) return `<span class="chip good">受注</span>`;
  if (d.status === "stopped") return `<span class="chip">止まった${d.reason ? "：" + esc(d.reason) : ""}</span>`;
  return `<span class="chip accent">進行中</span>`;
}
function dueChip(due) {
  const n = daysUntil(due);
  if (n === null) return `<span class="chip">期日なし</span>`;
  if (n < 0) return `<span class="chip bad">期限切れ ${-n}日</span>`;
  if (n === 0) return `<span class="chip warn">今日</span>`;
  if (n <= 3) return `<span class="chip warn">あと${n}日</span>`;
  return `<span class="chip">${md(due)}</span>`;
}
function rateChip(k, n, target) {
  if (n < 3) return `<span class="chip">件数が少ない</span>`;
  const r = pct(k, n);
  return r >= target ? `<span class="chip good">目標${target}%以上</span>` : `<span class="chip warn">目標${target}%未満</span>`;
}

let editingDeal = null;
function openDeal(id, extra) {
  const d = id ? Object.assign({}, S.deals.find((x) => x.id === id)) : Object.assign({ stage: 1, status: "open", source: "live" }, extra || {});
  if (id && !d.company) { toast("記録が見つかりませんでした"); return; }
  editingDeal = d;
  openSheet(dealForm(d));
  const sync = () => { $("#f-reason-wrap").hidden = $("#f-status").value !== "stopped"; };
  $("#f-status").addEventListener("change", sync); sync();
  $("#f-stage").addEventListener("change", () => { if ($("#f-stage").value === "6") $("#f-status").value = "won"; sync(); });
  $("#deal-form").addEventListener("submit", saveDeal);
}
async function saveDeal(ev) {
  ev.preventDefault();
  const v = (id) => { const el = $("#" + id); return el ? el.value.trim() : ""; };
  const company = v("f-company");
  if (!company) { $("#f-company").focus(); toast("会社名を入れてください"); return; }
  const stage = Number(v("f-stage")) || 1;
  let status = v("f-status") || "open";
  if (stage === 6) status = "won";
  const data = {
    company, stage, status, next: v("f-next"), due: v("f-due"),
    reason: status === "stopped" ? (v("f-reason") || "不明") : "",
    size: v("f-size"), industry: v("f-industry"), role: v("f-role"), entry: v("f-entry"), theme: v("f-theme"),
    venue: $("#f-venue").checked, pain: v("f-pain"), questions: v("f-questions"), hookSeries: v("f-hookSeries"), hook: v("f-hook"), memo: v("f-memo"),
    verdict: v("f-verdict"), source: editingDeal.source || "live"
  };
  const id = editingDeal.id || newId("d");
  const btn = ev.submitter || $("#deal-form [type=submit]"); if (btn) btn.disabled = true;
  try { await Store.put("deals", id, data); closeSheet(); toast("保存しました"); }
  catch (e) { toast(e.message); if (btn) btn.disabled = false; }
}

function knownFromRecords(company) {
  const mine = S.deals.filter((d) => company && d.company && (d.company.includes(company) || company.includes(d.company)));
  const qs = S.deals.map((d) => d.questions).filter(Boolean).slice(0, 12);
  const rs = Object.entries(stats(S.deals).reasons).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([r, n]) => `${r}（${n}件）`);
  return {
    mine: mine.map((d) => `- 段階：${STAGES[Number(d.stage) || 1]}／状態：${STATUS[d.status] || "進行中"}／課題：${clip(d.pain, 160) || "未記入"}／質問・懸念：${clip(d.questions, 160) || "未記入"}／刺さった話：${clip([seriesName(d.hookSeries), d.hook].filter(Boolean).join("：") , 160) || "未記入"}`).join("\n") || "（この会社の記録はない）",

}

async function practiceTurn() {
  if (AI.state !== "on") { toast("AIが使えません。「プロンプトをコピー」をお使いください"); renderChat(); return; }
  P.busy = true; renderChat("");
  const ctl = new AbortController(); P.ctl = ctl;
  const input = [{ role: "user", content: P.rules + (P.turns.length ? "" : "\n\nでは始めてください。あなた（人事）の最初のひと言だけを返してください。") }].concat(P.turns);
  try {
    const { text } = await AI.fn(input, { modelTier: "quick", cache: false, signal: ctl.signal, onText: ({ text }) => { const last = $("#p-msgs .msg.hr:last-of-type"); if (last && P.busy) { last.innerHTML = `<span class="who">${esc((PERSONAS.find((p) => p.id === P.persona) || {}).name)}</span>` + esc(text); } } });
    P.turns.push({ role: "assistant", content: text });
  } catch (e) {
    const m = aiErr(e); if (m) toast(m);
    if (e && e.text) P.turns.push({ role: "assistant", content: e.text });
    else if (P.turns.length && P.turns[P.turns.length - 1].role === "user") { /* 入力は残す */ }
  }
  P.busy = false; P.ctl = null; renderChat();
}
async function sendPractice() {
  const inp = $("#p-input"); const v = inp && inp.value.trim();

  if (AI.state !== "on") { toast("AIが使えません。「プロンプトをコピー」をお使いください"); renderChat(); return; }
  await practiceTurn();
}
async function feedbackPractice() {
  if (P.busy) return;
  P.busy = true; renderChat();
  const per = PERSONAS.find((p) => p.id === P.persona) || PERSONAS[0];
  const transcript = P.turns.map((t) => (t.role === "assistant" ? "人事：" : "インターン：") + t.content).join("\n");
  const prompt = `研修会社のインターンが、大企業の人事を相手に営業ロールプレイをしました。インターンの話し方を講評してください。

# 相手（AIが演じた人事）
${per.brief}
# 場面
${(SCENES.find((s) => s.id === P.scene) || {}).name}

# やりとり
${clip(transcript, 20000)}

# 観点（各1〜4点。1＝できていない、2＝一部、3＝できている、4＝手本になる）
${RUBRIC.map((r) => `- ${r.id}（${r.name}）：${r.desc}`).join("\n")}

# 守ること
- インターンは専門家ではなく案内役。専門家のふりをしないことは減点しない。むしろ評価する。
- 良かった点・直す点は、やりとりの具体的な発言を挙げて書く。
- 「次に試す一言」は、そのまま口に出せる一文。

# 出力
次のJSONだけを返す。
{"scores":{"mitate":1,"taito":1,"teian":1,"shinrai":1},"summary":"総評（2文）","good":["良かった点"],"improve":["直す点"],"try":"次に試す一言"}`;
  try {
    const f = await aiJSON(prompt, "default");
    const sc = {}; RUBRIC.forEach((r) => { const n = Math.max(1, Math.min(4, Math.round(Number(f && f.scores && f.scores[r.id]) || 1))); sc[r.id] = n; });
    P.feedback = { scores: sc, summary: str(f && f.summary), good: arr(f && f.good).map(str).slice(0, 5), improve: arr(f && f.improve).map(str).slice(0, 5), try: str(f && f.try) };
    try {
      await Store.put("practice", newId("p"), { persona: P.persona, scene: P.scene, series: P.series, turns: P.turns.length, scores: sc, summary: P.feedback.summary, good: P.feedback.good, improve: P.feedback.improve, try: P.feedback.try, transcript: P.turns.slice(-40) });
    } catch (e) { toast(e.message); }
  } catch (e) { const m = aiErr(e); if (m) toast(m); }
  P.busy = false; renderChat();
}

      break;
    }
    case "open-brief": { const b = S.briefs.find((x) => x.id === id); if (!b) break; Brief.cur = Object.assign({}, b); fillBriefForm(b); renderBriefOut(); $("#brief-out").scrollIntoView({ behavior: "smooth", block: "start" }); break; }
    case "del-brief":
      if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "もう一度押すと削除"; break; }
      try { await Store.del("briefs", id); Brief.cur = null; renderBriefOut(`<div class="empty">削除しました。</div>`); } catch (e) { toast(e.message); }
      break;
    case "copy-brief-text": if (Brief.cur) copyText(briefAsText(Brief.cur), "ブリーフを"); break;

    /* 社内説明の1枚 */
    case "copy-onepager": { const did = $("#op-deal").value; if (!did) { toast("商談記録を選んでください"); break; } copyText(onepagerPrompt(did, $("#op-extra").value.trim()), "プロンプトを"); break; }
    case "run-onepager": {
      const did = $("#op-deal").value; if (!did) { $("#op-deal").focus(); toast("商談記録を選んでください"); break; }
      const ta = $("#op-text"); const ctl = new AbortController(); Brief.ctl = ctl;
      t.dataset.busy = "1"; paintAI(); $("#op-stop").hidden = false; ta.value = ""; ta.placeholder = "考えています…";
      try {
        const { text } = await AI.fn(onepagerPrompt(did, $("#op-extra").value.trim()), { cache: false, signal: ctl.signal, onText: ({ text }) => { ta.value = text; } });
        ta.value = text;
        const d = S.deals.find((x) => x.id === did) || {};
        Brief.op = { dealId: did, company: d.company, text, status: "draft", id: null }; paintOpStatus();
      } catch (e) { const m = aiErr(e); if (m) toast(m); if (e && e.text) ta.value = e.text; }
      ta.placeholder = "ここに下書きが出ます。そのまま直せます。";
      t.dataset.busy = ""; $("#op-stop").hidden = true; Brief.ctl = null; paintAI();
      break;
    }
    case "save-onepager": case "check-onepager": {
      const text = $("#op-text").value.trim(); if (!text) { toast("下書きがありません"); break; }
      const did = $("#op-deal").value || Brief.op.dealId; const d = S.deals.find((x) => x.id === did) || {};
      const oid = Brief.op.id || newId("o");
      const data = { dealId: did, company: d.company || Brief.op.company || "（会社未選択）", text, status: act === "check-onepager" ? "checked" : (Brief.op.status || "draft") };
      if (act === "check-onepager") data.checkedBy = Store.uid || null;
      try { await Store.put("onepagers", oid, data); Brief.op = Object.assign({ id: oid }, data); paintOpStatus(); toast(act === "check-onepager" ? "講師の確認済みにしました" : "保存しました"); } catch (e) { toast(e.message); }
      break;
    }
    case "open-onepager": { const o = S.onepagers.find((x) => x.id === id); if (!o) break; Brief.op = Object.assign({}, o); $("#op-deal").value = o.dealId || ""; $("#op-text").value = o.text || ""; paintOpStatus(); break; }
    case "copy-op-text": { const v = $("#op-text").value; if (v) copyText(v, "下書きを"); break; }

    /* ストーリー */
    case "add-series": openSeries(null); break;
    case "edit-series": openSeries(id); break;
    case "archive-series": try { const s = seriesList().find((x) => x.id === id); await Store.put("series", id, Object.assign({}, s, { archived: true })); closeSheet(); } catch (e) { toast(e.message); } break;
    case "open-cell": openCell(t.dataset.s, t.dataset.p); break;
    case "copy-cell": if (editingCell) copyText(storyPrompt(editingCell.s, editingCell.p), "プロンプトを"); break;
    case "run-cell": {
      if (!editingCell) break;
      if (!editingCell.s.core) { toast("先に連載の「核の視点」を入れてください"); break; }
      const ta = $("#c-text"); const ctl = new AbortController(); Sheet.ctl = ctl;
      t.dataset.busy = "1"; paintAI(); $("#c-stop").hidden = false; const before = ta.value; ta.value = ""; ta.placeholder = "考えています…";
      try {
        const { text } = await AI.fn(storyPrompt(editingCell.s, editingCell.p), { cache: false, signal: ctl.signal, onText: ({ text }) => { ta.value = text; } });
        ta.value = text; const r = $$("input[name=c-status]"); r.forEach((x) => { x.checked = x.value === "draft"; });
      } catch (e) { const m = aiErr(e); if (m) toast(m); if (ta.isConnected) ta.value = (e && e.text) || before; }
      if (t.isConnected) { t.dataset.busy = ""; $("#c-stop").hidden = true; ta.placeholder = ""; }
      Sheet.ctl = null; paintAI();
      break;
    }
    case "save-cell": {
      if (!editingCell) break;
      const text = $("#c-text").value.trim(); const st = ($("input[name=c-status]:checked") || {}).value || "draft";
      const data = { series: editingCell.s.id, phase: editingCell.p.id, text, status: st };
      if (st === "checked") data.checkedBy = Store.uid || null;
      try { await Store.put("story", editingCell.id, data); closeSheet(); toast("保存しました"); } catch (e) { toast(e.message); }
      break;
    }
    case "check-series": {
      const s = seriesList().find((x) => x.id === id); if (!s) break;
      const filled = S.story.filter((x) => x.series === s.id && x.text).length;
      openSheet(`<div class="stack"><div class="sheet-head"><div><h2>同じ話か確かめる</h2><p class="small muted">${esc(s.name)}・トーク${filled}／${PHASES.length}フェーズ</p></div><button class="btn ghost sm" type="button" data-act="close">閉じる</button></div>
        <p class="small">核の視点と各フェーズのトークを読み、ずれ・つながっていない約束・言い方の揺れを探す。資料p.8「各フェーズで同じ話をしているかを、何で確かめるか」への一つの答え。</p>
        ${aiButtons("run-consistency", "確かめる", "copy-consistency")}<div id="cs-out"></div></div>`);
      editingCell = { s };
      break;
    }
    case "copy-consistency": if (editingCell) copyText(consistencyPrompt(editingCell.s), "プロンプトを"); break;
    case "run-consistency": {
      if (!editingCell) break;
      const s = editingCell.s;
      if (S.story.filter((x) => x.series === s.id && x.text).length < 2) { toast("2つ以上のフェーズにトークを入れてから確かめてください"); break; }
      t.dataset.busy = "1"; paintAI(); $("#cs-out").innerHTML = `<span class="thinking">読み比べています</span>`;
      try {
        const raw = await aiJSON(consistencyPrompt(s), "default");
        const r = { consistent: !!(raw && raw.consistent), summary: str(raw && raw.summary), drifts: arr(raw && raw.drifts).filter((d) => typeof d === "object").map((d) => ({ phase: str(d.phase), issue: str(d.issue), fix: str(d.fix) })) };
        const out = $("#cs-out"); if (!out) break;
        out.innerHTML = `<div class="ai-out"><div class="ai-status">${r.consistent ? `<span class="chip good">大きなずれはない</span>` : `<span class="chip warn">ずれがある</span>`}<span class="chip warn">AIの見立て</span></div><p>${esc(r.summary)}</p>
          ${(r.drifts || []).length ? `<ul class="hyps">${r.drifts.map((d) => `<li class="hyp"><div class="hyp-head"><span class="chip">${esc(d.phase)}</span><strong>${esc(d.issue)}</strong></div><div class="hyp-q"><span class="lbl">直し方</span>${esc(d.fix)}</div></li>`).join("")}</ul>` : ""}</div>`;
      } catch (e) { const m = aiErr(e); if (m) toast(m); const out = $("#cs-out"); if (out) out.innerHTML = ""; }
      if (t.isConnected) t.dataset.busy = ""; paintAI();
      break;
    }

    /* 練習 */
    case "copy-practice": {
      readPracticeSetup();
      copyText(practiceRules() + `\n\n---\nあなたが上の人事を演じ、私がインターンを演じます。あなたの最初のひと言から始めてください。私が「講評」と書いたら、ロールプレイを終えて、次の観点で1〜4点をつけ、良かった点・直す点・次に試す一言を返してください。\n${RUBRIC.map((r) => `- ${r.name}：${r.desc}`).join("\n")}`, "プロンプトを");
      break;
    }
    case "start-practice": {
      readPracticeSetup();
      P.on = true; P.turns = []; P.feedback = null; P.rules = practiceRules();
      t.textContent = "最初からやり直す";
      await practiceTurn();
      break;
    }
    case "send-practice": sendPractice(); break;
    case "feedback-practice": feedbackPractice(); break;
    case "stop-ai": if (P.ctl) P.ctl.abort(); if (Sheet.ctl) Sheet.ctl.abort(); if (Brief.ctl) Brief.ctl.abort(); break;
  }
});
function readPracticeSetup() {
  const r = $("input[name=p-persona]:checked"); if (r) P.persona = r.value;
  const sc = $("#p-scene"); if (sc) P.scene = sc.value;
  const se = $("#p-series"); if (se) P.series = se.value;
}
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.matches("[data-bcheck]") && Brief.cur) {
    Brief.cur.checks = Object.assign({}, Brief.cur.checks || {}, { [t.dataset.bcheck]: t.checked });
    if (Brief.cur.status === "checked" && !t.checked) Brief.cur.status = "draft";
    const r = Brief.cur.result || {}; const keys = (r.hypotheses || []).map((_, i) => "h" + i).concat((r.factcheck || []).map((_, i) => "f" + i));
    const btn = $("[data-act=check-brief]"); if (btn) btn.disabled = !(keys.length && keys.every((k) => Brief.cur.checks[k])) || Brief.cur.status === "checked";
  }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "r-q") { Records.q = ev.target.value; clearTimeout(Records._t); Records._t = setTimeout(refreshView, 150); }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

/* ツールチップ */
const tip = $("#tip");
function showTip(el, x, y) { tip.textContent = el.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect(); let L = x + 12, T = y + 14; if (L + r.width > innerWidth - 8) L = innerWidth - r.width - 8; if (T + r.height > innerHeight - 8) T = y - r.height - 10; tip.style.left = Math.max(8, L) + "px"; tip.style.top = Math.max(8, T) + "px"; }
document.addEventListener("pointermove", (ev) => { const el = ev.target.closest && ev.target.closest("[data-tip]"); if (el) showTip(el, ev.clientX, ev.clientY); else tip.hidden = true; });
document.addEventListener("pointerleave", () => { tip.hidden = true; });

/* 起動 */
window.addEventListener("hashchange", go);
go();
Store.init();
initAI();
})();
</script>
